<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="evaluation-title evaluation-desc">
  <title id="evaluation-title">Threat detection comparison: coverage and end-to-end recall</title>
  <desc id="evaluation-desc">Comparison of two models on 16 labeled messages. Nemotron 3.5 Bolt e4b inspected 16 of 16 and detected 9 of 9 threats end-to-end. Nemotron 3.5 Lightning 30b-a3b inspected 12 of 16 and detected 6 of 9 threats; 4 messages were uninspected, including 3 threats. Precision and false-positive rate are conditional on completed inspections.</desc>
